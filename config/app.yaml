app:
  name: Meine Website
  # The address of the website, for canonical links. Required live.
  # url: https://example.com
  # Times are kept and shown in this time zone, e.g. those of events.
  timezone: Europe/Berlin

database:
  url: '%env(DATABASE_URL)%'

# Languages of the website by code, the first one is the default and has
# no prefix. Others get their code as prefix (/en/…) and show the content
# of the default language where a page has no translation.
languages:
  de: { title: Deutsch }
  # en: { title: English }                     # /en/about-us
  # fr: { title: Français, fallback: false }   # no page without translation
  # nl: { title: Nederlands, domain: '%env(DOMAIN_NL)%' }

# The active theme: an installed extension with "theme:" in its frootbox.yaml.
# theme: acme/website

# The backend. path is where it lives (its first segment cannot be a page
# slug), language the language of its user interface; by default the
# first language of the website if the backend has texts for it, else
# English.
# backend:
#   path: /cms
#   language: de

# Logs are written to var/log/. Uncomment to change the level:
# debug, info, notice, warning, error, critical, alert, emergency.
# Defaults: debug in dev, warning in prod.
# log:
#   level: warning

# The sender of mails, e.g. of forms. Without it the one of the backend
# settings, else noreply@ and the host of app.url.
# mail:
#   from: hello@example.com

# The hub the website connects to in the backend under Connection, e.g.
# a service running locally while developing it.
# hub:
#   url: https://hub.frootbox.de

# Own prices of the AI per model, e.g. for an own contract with the
# provider, in US dollars per million tokens. Without them a website
# connected to the hub takes the list of the hub, else the module's.
# Without cacheRead and cacheWrite the cache costs as much as the input.
# ai:
#   prices:
#     claude-opus-5-5: { input: 4, output: 20, cacheRead: 0.2, cacheWrite: 5 }

# Sign-in: a session ends this long after its last use, with "stay
# signed in" in days, else in hours. A session through a provider such as
# the hub ends provider_session_hours after signing in, used or not.
# auth:
#   session_days: 14
#   session_hours: 12
#   provider_session_hours: 12

# Changes can be undone for undo_days, then they are shortened to what
# changed; the log of who changed what is kept for log_days. Deleted
# media are kept as long as changes can be undone.
# actions:
#   undo_days: 30
#   log_days: 365

# The largest upload in MB by kind of file. PHP's upload_max_filesize
# and post_max_size must allow it too.
# media:
#   max_upload_mb: 20       # images
#   max_video_mb: 2000
#   max_document_mb: 100

# How long a link to the preview of a draft works.
# preview:
#   days: 14

# Backups of the database in storage/backups/: one before the first
# change of a day (0 turns it off) and before every migrate. Kept are
# all of the last 7 days, one a week up to 5 weeks, one a month up to
# 6 months, then one a quarter up to max_months; always those made by
# hand and the last keep_migrate ones from before a migrate.
# backup:
#   interval_hours: 24
#   stages: { all: 7 days, week: 5 weeks, month: 6 months }
#   max_months: 12
#   keep_migrate: 3

# Proxies in front of the website, e.g. a load balancer: addresses or
# networks. Only from them X-Forwarded-For names the visitor and
# X-Forwarded-Proto the scheme. Never list a network others can use.
# http:
#   trusted_proxies: [10.0.0.0/8]
