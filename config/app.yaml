app:
  name: Meine Website
  # The address of the website, for canonical links. Required live.
  # url: https://example.com

database:
  url: '%env(DATABASE_URL)%'

# Languages of the website by code, the first one is the default.
languages:
  de: { title: Deutsch }

# The active theme: an installed extension with "theme:" in its frootbox.yaml.
# theme: acme/website

# Logs are written to var/log/. Uncomment to change the level:
# debug, info, notice, warning, error, critical, alert, emergency.
# Defaults: debug in dev, warning in prod.
# log:
#   level: warning
